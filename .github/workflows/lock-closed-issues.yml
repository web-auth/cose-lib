name: 'Lock Issues'

on:
  schedule:
    - cron: '12 6 * * *'

# Nothing is granted by default; the single job raises only what locking an issue needs.
permissions: {}

jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      # `process-only: issues` below: pull requests are never touched, so `pull-requests: write`
      # is deliberately not granted. Add it if that input is ever widened.
      issues: write
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6.0.2
        with:
          github-token: ${{ github.token }}
          issue-inactive-days: '31'
          exclude-issue-created-before: ''
          exclude-any-issue-labels: ''
          add-issue-labels: ''
          issue-comment: >
            This thread has been automatically locked since there has not been
            any recent activity after it was closed. Please open a new issue for
            related bugs.
          issue-lock-reason: 'resolved'
          process-only: 'issues'
