name: "Automatic Releases"

# The five commands must stay steps of a single job: "release" runs
# `git checkout <release branch>`, which is what makes that branch available
# locally, and the following commands require it. Splitting them into separate
# jobs gives each one a fresh checkout of the default branch, so every release
# made from an older branch fails with "not a valid object name".
#
# The checkout must be unshallow for the same reason: "switch-default-branch-
# to-next-minor" resolves the newest release branch locally, and the default
# shallow clone only contains the ref that triggered the workflow.
#
# The steps run `./.github/actions/automatic-releases`, a local wrapper around
# laminas/automatic-releases that pins the executed container image to an exact
# version; see that action.yml for why the upstream `uses:` reference, whatever
# it is pinned to, does not select the code that runs.

on:
  milestone:
    types:
      - "closed"

# The release job raises what it needs below; anything this workflow may grow
# later starts from read-only.
permissions:
  contents: read

jobs:
  release:
    name: "Release"
    runs-on: ubuntu-latest

    # The two organisation secrets used below are the most valuable credentials this repository can
    # reach. Restrict them to this environment and give it required reviewers, so that closing a
    # milestone alone no longer hands them out:
    #
    #   gh api -X PUT repos/web-auth/cose-lib/environments/release \
    #     -F 'reviewers[][type]=User' -F "reviewers[][id]=$(gh api users/Spomky --jq .id)"
    #
    # Until that is done the environment is created on the first run with no protection rule and
    # changes nothing.
    environment: release

    # `create-merge-up-pull-request`, `bump-changelog` and `create-milestones` below run with
    # secrets.GITHUB_TOKEN: they push a branch, open a pull request and create milestones.
    # `release` and `switch-default-branch-to-next-minor` use ORGANIZATION_ADMIN_TOKEN instead and
    # need nothing from this token.
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0
          # The commands do not use the checkout credential: each one removes the `origin` remote
          # and re-adds it behind its own `credential.helper store` file, built from the GITHUB_TOKEN
          # environment variable (Laminas\AutomaticReleases\Git\
          # FetchAndSetCurrentUserByReplacingCurrentOriginRemote). Not persisting it keeps the token
          # out of the workspace `.git/config` that is mounted into the container.
          persist-credentials: false

      - name: "Release"
        uses: "./.github/actions/automatic-releases"
        with:
          command-name: "laminas:automatic-releases:release"
        env:
          "SHELL_VERBOSITY": "3"
          "GITHUB_TOKEN": ${{ secrets.ORGANIZATION_ADMIN_TOKEN }}
          "SIGNING_SECRET_KEY": ${{ secrets.SIGNING_SECRET_KEY }}
          "GIT_AUTHOR_NAME": ${{ secrets.GIT_AUTHOR_NAME }}
          "GIT_AUTHOR_EMAIL": ${{ secrets.GIT_AUTHOR_EMAIL }}

      - name: "Create Merge-Up Pull Request"
        uses: "./.github/actions/automatic-releases"
        with:
          command-name: "laminas:automatic-releases:create-merge-up-pull-request"
        env:
          "SHELL_VERBOSITY": "3"
          "GITHUB_TOKEN": ${{ secrets.GITHUB_TOKEN }}
          "SIGNING_SECRET_KEY": ${{ secrets.SIGNING_SECRET_KEY }}
          "GIT_AUTHOR_NAME": ${{ secrets.GIT_AUTHOR_NAME }}
          "GIT_AUTHOR_EMAIL": ${{ secrets.GIT_AUTHOR_EMAIL }}

      - name: "Create and/or Switch to new Release Branch"
        uses: "./.github/actions/automatic-releases"
        with:
          command-name: "laminas:automatic-releases:switch-default-branch-to-next-minor"
        env:
          "SHELL_VERBOSITY": "3"
          "GITHUB_TOKEN": ${{ secrets.ORGANIZATION_ADMIN_TOKEN }}
          "SIGNING_SECRET_KEY": ${{ secrets.SIGNING_SECRET_KEY }}
          "GIT_AUTHOR_NAME": ${{ secrets.GIT_AUTHOR_NAME }}
          "GIT_AUTHOR_EMAIL": ${{ secrets.GIT_AUTHOR_EMAIL }}

      - name: "Bump Changelog Version On Originating Release Branch"
        uses: "./.github/actions/automatic-releases"
        with:
          command-name: "laminas:automatic-releases:bump-changelog"
        env:
          "SHELL_VERBOSITY": "3"
          "GITHUB_TOKEN": ${{ secrets.GITHUB_TOKEN }}
          "SIGNING_SECRET_KEY": ${{ secrets.SIGNING_SECRET_KEY }}
          "GIT_AUTHOR_NAME": ${{ secrets.GIT_AUTHOR_NAME }}
          "GIT_AUTHOR_EMAIL": ${{ secrets.GIT_AUTHOR_EMAIL }}

      - name: "Create new milestones"
        uses: "./.github/actions/automatic-releases"
        with:
          command-name: "laminas:automatic-releases:create-milestones"
        env:
          "SHELL_VERBOSITY": "3"
          "GITHUB_TOKEN": ${{ secrets.GITHUB_TOKEN }}
          "SIGNING_SECRET_KEY": ${{ secrets.SIGNING_SECRET_KEY }}
          "GIT_AUTHOR_NAME": ${{ secrets.GIT_AUTHOR_NAME }}
          "GIT_AUTHOR_EMAIL": ${{ secrets.GIT_AUTHOR_EMAIL }}
