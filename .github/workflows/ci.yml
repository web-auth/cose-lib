name: 📁 PHP CI & Docker Build

on:
  push:
    branches:
      - '*.*.x'
    tags: ['*']
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# No job of this workflow writes anything back to the repository: reading the code is all the
# GITHUB_TOKEN is needed for. This block overrides the repository default, so it holds even if the
# default is (or becomes again) "Read and write permissions".
permissions:
  contents: read

jobs:
  pre_checks:
    name: "0️⃣ Pre-checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: "Audit the GitHub Actions workflows"
        run: php .ci-tools/workflow-audit.php

      - name: "Check file permissions"
        run: |
          NON_EXECUTABLE=$(find . -type f -not -path './.git/*' -not -path './bin/console' -not -path './frankenphp/docker-entrypoint.sh' -not -path './link' -executable)
          if [[ -n "$NON_EXECUTABLE" ]]; then
            echo "Found non-executable files with executable permission:"
            echo "$NON_EXECUTABLE"
            exit 1
          fi

      - name: "Find non-printable ASCII characters"
        run: |
          if LC_ALL=C.UTF-8 find . -type f -name "*.php" -print0 | xargs -0 grep -PHn "[[:cntrl:]]"; then
            echo "Non-printable ASCII characters found"
            exit 1
          fi

  prepare_dependencies:
    name: "📦 Prepare Composer Dependencies"
    needs: [pre_checks]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    outputs:
      cache-key: ${{ steps.cache-key-generator.outputs.key }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: cache-key-generator
        run: echo "key=composer-${{ runner.os }}-${{ hashFiles('composer.json') }}" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ steps.cache-key-generator.outputs.key }}
          restore-keys: |
            composer-${{ runner.os }}-

      - uses: ramsey/composer-install@v4
        with:
          dependency-versions: highest
          composer-options: --optimize-autoloader

  phpstan:
    name: "1️⃣ Static Analysis (PHPStan)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ needs.prepare_dependencies.outputs.cache-key }}
      - run: castor phpstan

  ecs:
    name: "2️⃣ Coding Standards (ECS)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ needs.prepare_dependencies.outputs.cache-key }}
      - run: castor ecs

  rector:
    name: "3️⃣ Refactoring (Rector)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ needs.prepare_dependencies.outputs.cache-key }}
      - run: castor rector

  validate:
    name: "4️⃣ Validate composer.json"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ needs.prepare_dependencies.outputs.cache-key }}
      - run: |
          composer dump-autoload --optimize --strict-psr
          composer validate --strict
          composer normalize --dry-run --diff || true

  lint:
    name: "5️⃣ Syntax Check"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: composer exec -- parallel-lint src tests

  check_licenses:
    name: "6️⃣ License Check"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: castor check-licenses

  deptrac:
    name: "7️⃣ Architecture Layer Check (Deptrac)"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            vendor
            ~/.composer/cache
          key: ${{ needs.prepare_dependencies.outputs.cache-key }}
      - run: castor deptrac

  tests:
    name: "🧪 Unit & Functional Tests (PHP ${{ matrix.php-version }}${{ matrix.lowest-deps && ' - Lowest Deps' || '' }})"
    needs:
      - prepare_dependencies
      - phpstan
      - ecs
      - rector
      - lint
      - validate
      - check_licenses
      - deptrac
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        # ml-dsa: whether the ML-DSA algorithms (RFC 9964) must be available on the job's platform, which
        # tests/Algorithm/Signature/MLDSA/MLDSATest.php asserts. The phpqa images ship OpenSSL 3.5, so the gate is
        # the PHP version alone here: closed below 8.4, open from 8.4 on. The OpenSSL side of the gate is exercised
        # by the tests_without_ml_dsa job below.
        include:
          - php-version: '8.2'
            lowest-deps: true
            ml-dsa: 'no'
          - php-version: '8.2'
            ml-dsa: 'no'
          - php-version: '8.3'
            ml-dsa: 'no'
          - php-version: '8.4'
            ml-dsa: 'yes'
          - php-version: '8.5'
            experimental: true
            ml-dsa: 'yes'
    container:
      image: ghcr.io/spomky-labs/phpqa:${{ matrix.php-version }}
    env:
      XDEBUG_MODE: 'off'
      PHP_VERSION: ${{ matrix.php-version }}
      COSE_ML_DSA_EXPECTED: ${{ matrix.ml-dsa }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          if [ "${{ matrix.lowest-deps || 'false' }}" = "true" ]; then
            composer update --prefer-lowest --no-interaction --no-progress
          else
            composer install --no-interaction --no-progress
          fi

      # PHPUnit is invoked directly rather than through `castor phpunit`: castor itself requires PHP >= 8.4 and
      # this job also runs on the older versions of the matrix. Coverage is produced by the mutation testing job.
      - name: Run PHPUnit
        run: composer exec -- phpunit-11 --configuration .ci-tools/phpunit.xml.dist

  # The other side of the ML-DSA platform gate: a PHP recent enough (8.4) on an OpenSSL too old (3.0, the one
  # Ubuntu 24.04 ships and the PHP of the PPA links against). MLDSA44::isSupported() must be false there, create()
  # must throw, and the rest of the suite must be unaffected; MLDSATest asserts the first through
  # COSE_ML_DSA_EXPECTED. The runner is pinned rather than "latest" so that a newer image with OpenSSL 3.5 cannot
  # silently turn this job into a copy of the one above.
  tests_without_ml_dsa:
    name: "🧪 Unit & Functional Tests (PHP 8.4 - OpenSSL 3.0, no ML-DSA)"
    needs:
      - prepare_dependencies
      - phpstan
      - ecs
      - rector
      - lint
      - validate
      - check_licenses
      - deptrac
    runs-on: ubuntu-24.04
    env:
      COSE_ML_DSA_EXPECTED: 'no'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: '8.4'
          extensions: openssl, sodium, mbstring, gmp, intl
          # phpunit-11 is what the phpqa images provide; this runner gets the PHAR of the same major.
          tools: composer, phpunit:11
          coverage: none
      - name: Show the OpenSSL the PHP binary loaded
        run: |
          php -r 'echo PHP_VERSION, " built against ", OPENSSL_VERSION_TEXT, PHP_EOL;'
          openssl version
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPUnit
        # --no-extensions: the slow-test-detector extension the config bootstraps comes with the phpqa images, not
        # with the PHAR, and a missing extension is a runner warning the config turns into a failure.
        run: phpunit --configuration .ci-tools/phpunit.xml.dist --no-extensions

  infection:
    name: "🧬 Mutation Testing"
    needs: [tests]
    if: ${{ endsWith(github.ref_name, '.x') }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/spomky-labs/phpqa:8.4
    env:
      XDEBUG_MODE: coverage
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run PHPUnit
        run: castor phpunit
      - name: Execute Infection
        run: castor infect

  exported_files:
    name: "8️⃣ Exported Files Check"
    needs: [prepare_dependencies]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check exported files
        run: |
          EXPECTED="CODE_OF_CONDUCT.md,LICENSE,README.md,RELEASES.md,SECURITY.md,composer.json"
          CURRENT=$(git archive HEAD | tar --list | grep -v '/$' | grep -Ev '^(assets|bin|config|fixtures|frankenphp|migrations|public|src|templates|translations)/' | sort | paste -sd "," -)
          echo "CURRENT = ${CURRENT}"
          echo "EXPECTED = ${EXPECTED}"
          if [[ "$CURRENT" != "$EXPECTED" ]]; then
            echo "❌ Exported files do not match expected list"
            exit 1
          fi
